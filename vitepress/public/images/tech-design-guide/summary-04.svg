<svg viewBox="0 0 680 460" width="100%" role="img" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>如何写好技术方案总结图</title>
  <desc>技术方案 7 大核心要素流程及常见错误与正确做法</desc>

  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">如何写好技术方案</text>
  <text x="340" y="50" text-anchor="middle" font-size="13" font-weight="400" fill="#888780">7 大核心要素，按方案可实现无需追问</text>

  <!-- 7 elements as vertical timeline -->
  <line x1="70" y1="78" x2="70" y2="348" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/>

  <circle cx="70" cy="90" r="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="70" y="90" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#712B13">1</text>
  <text x="95" y="85" font-size="13" font-weight="500" fill="#712B13">背景与目标</text>
  <text x="95" y="101" font-size="12" font-weight="400" fill="#5F5E5A">为什么做？做成什么样？— 理解业务目标，而非复述需求</text>

  <circle cx="70" cy="130" r="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="70" y="130" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#633806">2</text>
  <text x="95" y="125" font-size="13" font-weight="500" fill="#633806">需求分析</text>
  <text x="95" y="141" font-size="12" font-weight="400" fill="#5F5E5A">核心流程？边界条件？— 用技术视角解读业务</text>

  <circle cx="70" cy="170" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="70" y="170" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#3C3489">3</text>
  <text x="95" y="165" font-size="13" font-weight="500" fill="#3C3489">架构设计</text>
  <text x="95" y="181" font-size="12" font-weight="400" fill="#5F5E5A">哪个上下文？哪些聚合？— 限界上下文界定系统边界</text>

  <circle cx="70" cy="210" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="70" y="210" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#3C3489">4</text>
  <text x="95" y="205" font-size="13" font-weight="500" fill="#3C3489">详细设计</text>
  <text x="95" y="221" font-size="12" font-weight="400" fill="#5F5E5A">数据模型 + 接口定义 + 核心流程伪代码</text>

  <circle cx="70" cy="250" r="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="70" y="250" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#0C447C">5</text>
  <text x="95" y="245" font-size="13" font-weight="500" fill="#0C447C">异常与边界</text>
  <text x="95" y="261" font-size="12" font-weight="400" fill="#5F5E5A">异常处理？并发控制？幂等？— 最见功力的部分</text>

  <circle cx="70" cy="290" r="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="70" y="290" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#0C447C">6</text>
  <text x="95" y="285" font-size="13" font-weight="500" fill="#0C447C">影响面评估</text>
  <text x="95" y="301" font-size="12" font-weight="400" fill="#5F5E5A">改了哪些模块？影响哪些下游？回滚方案？</text>

  <circle cx="70" cy="330" r="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="70" y="330" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#085041">7</text>
  <text x="95" y="325" font-size="13" font-weight="500" fill="#085041">排期与里程碑</text>
  <text x="95" y="341" font-size="12" font-weight="400" fill="#5F5E5A">分阶段交付，每阶段有明确产出</text>

  <line x1="40" y1="365" x2="640" y2="365" stroke="#D3D1C7" stroke-width="0.5"/>

  <!-- Common mistakes vs correct approach -->
  <text x="340" y="385" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">常见错误 vs 正确做法</text>

  <rect x="40" y="400" width="290" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="55" y="418" font-size="12" font-weight="500" fill="#712B13">常见错误</text>
  <text x="55" y="436" font-size="11" font-weight="400" fill="#5F5E5A">只抄需求 · 跳过分析 · 只列接口 · 不考虑异常并发</text>

  <rect x="350" y="400" width="290" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="365" y="418" font-size="12" font-weight="500" fill="#085041">正确做法</text>
  <text x="365" y="436" font-size="11" font-weight="400" fill="#5F5E5A">技术视角解读 · 先分析再设计 · 写清规则 · 评估异常幂等</text>
</svg>