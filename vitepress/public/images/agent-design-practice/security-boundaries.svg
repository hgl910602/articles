<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08264d"/><stop offset="1" stop-color="#0a5bff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#062452" flood-opacity=".10"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#0a5bff"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:39px;font-weight:760}.subtitle{font-size:18px;fill:#4a6480}.eyebrow{font-size:14px;font-weight:760;letter-spacing:1.7px}.section{font-size:18px;font-weight:760}.cardTitle{font-size:18px;font-weight:760}.body{font-size:15px;fill:#4b6580}.tiny{font-size:13px;fill:#607894}.white{fill:#fff}.whiteSoft{fill:#dceaff}.blue{fill:#0a5bff}.flow{fill:none;stroke:#0a5bff;stroke-width:2.5;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1600" height="940" fill="#f5f8fc"/>
  <text x="72" y="66" class="title">安全控制面：从模型建议到受限副作用</text>
  <text x="72" y="98" class="subtitle">指令负责引导，策略负责判定，审批负责授权，沙箱负责限制进程实际触达范围。</text>

  <g filter="url(#shadow)"><rect x="72" y="130" width="1456" height="88" rx="14" fill="#fff" stroke="#d8e2ef"/><rect x="72" y="130" width="176" height="88" rx="14" fill="url(#hero)"/><path d="M234 130H248V218H234" fill="url(#hero)"/></g>
  <text x="102" y="165" class="eyebrow whiteSoft">PROBLEM</text><text x="102" y="191" class="section white">安全问题</text>
  <text x="286" y="165" class="cardTitle">模型会读取网页、日志、仓库文档和 MCP 返回值，这些数据可能影响下一步工具选择</text>
  <text x="286" y="192" class="body">安全边界需要在模型之外落到确定性策略和操作系统隔离。</text>

  <rect x="72" y="248" width="1456" height="542" rx="18" fill="#fff" stroke="#d8e2ef" filter="url(#shadow)"/>
  <text x="98" y="286" class="eyebrow blue">CONTROL PATH</text><text x="98" y="313" class="section">一次工具调用经过四层控制</text>

  <g>
    <rect x="104" y="350" width="220" height="120" rx="14" fill="#f7faff" stroke="#9fc0f5"/><text x="130" y="384" class="eyebrow blue">LAYER 1 · GUIDE</text><text x="130" y="414" class="cardTitle">Model Instructions</text><text x="130" y="441" class="body">行为规则 · 项目约定</text><text x="130" y="461" class="tiny">软约束</text>
    <rect x="378" y="350" width="220" height="120" rx="14" fill="#edf4ff" stroke="#78a9f5"/><text x="404" y="384" class="eyebrow blue">LAYER 2 · DECIDE</text><text x="404" y="414" class="cardTitle">Policy / Hooks</text><text x="404" y="441" class="body">工具 · 参数 · 来源规则</text><text x="404" y="461" class="tiny">allow / ask / deny</text>
    <rect x="652" y="350" width="220" height="120" rx="14" fill="#e3eeff" stroke="#5d97f0"/><text x="678" y="384" class="eyebrow blue">LAYER 3 · AUTHORIZE</text><text x="678" y="414" class="cardTitle">User Approval</text><text x="678" y="441" class="body">一次性 · 会话级授权</text><text x="678" y="461" class="tiny">scope &amp; duration</text>
    <rect x="926" y="350" width="220" height="120" rx="14" fill="#0a5bff"/><text x="952" y="384" class="eyebrow whiteSoft">LAYER 4 · ENFORCE</text><text x="952" y="414" class="cardTitle white">OS Sandbox</text><text x="952" y="441" class="body whiteSoft">filesystem · network</text><text x="952" y="461" class="tiny whiteSoft">process · syscall</text>
    <rect x="1200" y="350" width="260" height="120" rx="14" fill="#08264d"/><text x="1226" y="384" class="eyebrow whiteSoft">SIDE EFFECT</text><text x="1226" y="414" class="cardTitle white">Tool Execution</text><text x="1226" y="441" class="body whiteSoft">workspace · shell · MCP</text><text x="1226" y="461" class="tiny whiteSoft">受限资源范围</text>
    <path d="M324 410H378M598 410H652M872 410H926M1146 410H1200" class="flow"/>
  </g>

  <g>
    <rect x="104" y="528" width="420" height="210" rx="15" fill="#f7faff" stroke="#9fc0f5"/>
    <text x="132" y="563" class="eyebrow blue">UNTRUSTED DATA</text><text x="132" y="594" class="section">外部内容进入数据通道</text>
    <text x="132" y="632" class="body">网页 · issue · 日志 · 陌生文档 · MCP 返回值</text>
    <rect x="132" y="656" width="364" height="52" rx="10" fill="#e8f1ff"/><text x="314" y="688" text-anchor="middle" class="cardTitle">来源标签 + 最小工具集合</text>

    <rect x="560" y="528" width="420" height="210" rx="15" fill="#edf4ff" stroke="#78a9f5"/>
    <text x="588" y="563" class="eyebrow blue">POLICY DECISION</text><text x="588" y="594" class="section">审批与沙箱两个维度独立配置</text>
    <text x="588" y="632" class="body">审批：动作是否需要授权</text><text x="588" y="660" class="body">沙箱：放行后可以触达哪些资源</text>
    <text x="588" y="696" class="tiny">低审批频率对应更细的沙箱边界</text>

    <rect x="1016" y="528" width="444" height="210" rx="15" fill="#e5efff" stroke="#5d97f0"/>
    <text x="1044" y="563" class="eyebrow blue">AUDIT TRAIL</text><text x="1044" y="594" class="section">每次决策都有结构化记录</text>
    <text x="1044" y="632" class="body">policy rule · approval scope · sandbox profile</text>
    <text x="1044" y="660" class="body">tool arguments · result · exit status</text>
    <text x="1044" y="696" class="tiny">用于恢复、审计和轨迹评测</text>
  </g>

  <rect x="72" y="824" width="1456" height="72" rx="14" fill="url(#hero)"/>
  <text x="102" y="868" class="section white">解法：模型负责提出动作，运行时负责判定，操作系统负责执行边界</text>
</svg>
