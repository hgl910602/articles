<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08264d"/><stop offset="1" stop-color="#0a5bff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#062452" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0a5bff"/></marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b2b55"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:39px;font-weight:760}.subtitle{font-size:18px;fill:#4a6480}.eyebrow{font-size:14px;font-weight:750;letter-spacing:1.8px}.section{font-size:18px;font-weight:760}.cardTitle{font-size:19px;font-weight:760}.body{font-size:15px;fill:#4b6580}.tiny{font-size:13px;fill:#607894}.white{fill:#fff}.whiteSoft{fill:#dceaff}.blue{fill:#0a5bff}.navy{fill:#08264d}.line{fill:none;stroke:#0a5bff;stroke-width:2.4;marker-end:url(#arrow)}.lineDark{fill:none;stroke:#0b2b55;stroke-width:2.2;marker-end:url(#arrowDark)}
    </style>
  </defs>
  <rect width="1600" height="950" fill="#f5f8fc"/>
  <text x="72" y="66" class="title">Coding Agent Harness 总体架构</text>
  <text x="72" y="98" class="subtitle">一条执行主链负责推进任务，Context、Policy 与 Event 三条控制面覆盖每一次采样和工具调用。</text>

  <g filter="url(#shadow)"><rect x="72" y="130" width="1456" height="92" rx="14" fill="#fff" stroke="#d8e2ef"/><rect x="72" y="130" width="176" height="92" rx="14" fill="url(#hero)"/><path d="M234 130 H248 V222 H234" fill="url(#hero)"/></g>
  <text x="102" y="166" class="eyebrow whiteSoft">PROBLEM</text><text x="102" y="194" class="section white">架构要解决的问题</text>
  <text x="286" y="169" class="cardTitle">模型每次只返回下一步意图</text><text x="286" y="197" class="body">产品还要持续管理会话状态、执行工具副作用、控制权限边界，并在中断后恢复现场。</text>

  <rect x="72" y="250" width="1456" height="526" rx="18" fill="#fff" stroke="#d8e2ef" filter="url(#shadow)"/>
  <text x="98" y="286" class="eyebrow blue">EXECUTION SPINE</text><text x="98" y="313" class="section">执行主链</text>

  <g>
    <rect x="104" y="340" width="190" height="104" rx="12" fill="#f8fbff" stroke="#9fc0f5"/><text x="199" y="376" text-anchor="middle" class="cardTitle">Client / Protocol</text><text x="199" y="402" text-anchor="middle" class="body">TUI · IDE · SDK · CI</text><text x="199" y="425" text-anchor="middle" class="tiny">input · stream · approval</text>
    <rect x="342" y="340" width="205" height="104" rx="12" fill="#edf4ff" stroke="#69a0ff"/><text x="444" y="376" text-anchor="middle" class="cardTitle">Thread Runtime</text><text x="444" y="402" text-anchor="middle" class="body">Thread · Turn · Item</text><text x="444" y="425" text-anchor="middle" class="tiny">route · steer · interrupt</text>
    <rect x="595" y="340" width="205" height="104" rx="12" fill="#0a5bff"/><text x="697" y="376" text-anchor="middle" class="cardTitle white">Context Builder</text><text x="697" y="402" text-anchor="middle" class="body whiteSoft">instructions · history</text><text x="697" y="425" text-anchor="middle" class="tiny whiteSoft">tools · workspace state</text>
    <rect x="848" y="340" width="205" height="104" rx="12" fill="#edf4ff" stroke="#69a0ff"/><text x="950" y="376" text-anchor="middle" class="cardTitle">Model Adapter</text><text x="950" y="402" text-anchor="middle" class="body">sample · stream · parse</text><text x="950" y="425" text-anchor="middle" class="tiny">usage · retry · provider</text>
    <rect x="1101" y="340" width="205" height="104" rx="12" fill="#08264d"/><text x="1203" y="376" text-anchor="middle" class="cardTitle white">Model</text><text x="1203" y="402" text-anchor="middle" class="body whiteSoft">message / tool_call[]</text><text x="1203" y="425" text-anchor="middle" class="tiny whiteSoft">决定下一步</text>
    <path d="M294 392 H342" class="line"/><path d="M547 392 H595" class="line"/><path d="M800 392 H848" class="line"/><path d="M1053 392 H1101" class="line"/>
  </g>

  <text x="98" y="500" class="eyebrow navy">ACTION LOOP</text><text x="98" y="527" class="section">工具副作用回路</text>
  <g>
    <rect x="342" y="548" width="205" height="92" rx="12" fill="#fff" stroke="#9fc0f5"/><text x="444" y="582" text-anchor="middle" class="cardTitle">Tool Dispatcher</text><text x="444" y="608" text-anchor="middle" class="body">call_id · schema · routing</text>
    <rect x="595" y="548" width="205" height="92" rx="12" fill="#e9f2ff" stroke="#4b8fff"/><text x="697" y="582" text-anchor="middle" class="cardTitle">Policy Gate</text><text x="697" y="608" text-anchor="middle" class="body">allow · ask · deny</text>
    <rect x="848" y="548" width="205" height="92" rx="12" fill="#e9f2ff" stroke="#4b8fff"/><text x="950" y="582" text-anchor="middle" class="cardTitle">Sandbox Executor</text><text x="950" y="608" text-anchor="middle" class="body">filesystem · process · network</text>
    <rect x="1101" y="548" width="205" height="92" rx="12" fill="#fff" stroke="#9fc0f5"/><text x="1203" y="582" text-anchor="middle" class="cardTitle">Tools / Workspace</text><text x="1203" y="608" text-anchor="middle" class="body">shell · files · MCP · apps</text>
    <path d="M1203 444 V500 H444 V548" class="lineDark"/><text x="790" y="486" text-anchor="middle" class="tiny">tool_call[]</text>
    <path d="M547 594 H595" class="line"/><path d="M800 594 H848" class="line"/><path d="M1053 594 H1101" class="line"/>
    <path d="M1203 640 V682 H697 V444" class="line"/><text x="940" y="673" text-anchor="middle" class="tiny">tool_result[] → append event → rebuild context</text>
  </g>

  <g><rect x="104" y="704" width="420" height="48" rx="10" fill="#edf4ff"/><rect x="546" y="704" width="420" height="48" rx="10" fill="#e3eeff"/><rect x="988" y="704" width="420" height="48" rx="10" fill="#d9e8ff"/><text x="314" y="734" text-anchor="middle" class="section">Context：采样前编译模型视图</text><text x="756" y="734" text-anchor="middle" class="section">Policy：副作用前判定边界</text><text x="1198" y="734" text-anchor="middle" class="section">Event：状态变化写入账本</text></g>

  <rect x="72" y="810" width="1456" height="92" rx="14" fill="url(#hero)"/>
  <text x="102" y="847" class="eyebrow whiteSoft">ARCHITECTURE RESULT</text><text x="102" y="876" class="section white">最终形成可执行、可控制、可恢复的 Agent Runtime</text>
  <g><rect x="795" y="831" width="200" height="48" rx="24" fill="#fff" fill-opacity=".13" stroke="#87b3ff"/><rect x="1015" y="831" width="200" height="48" rx="24" fill="#fff" fill-opacity=".13" stroke="#87b3ff"/><rect x="1235" y="831" width="200" height="48" rx="24" fill="#fff" fill-opacity=".13" stroke="#87b3ff"/><text x="895" y="862" text-anchor="middle" class="cardTitle white">执行闭环</text><text x="1115" y="862" text-anchor="middle" class="cardTitle white">安全边界</text><text x="1335" y="862" text-anchor="middle" class="cardTitle white">状态恢复</text></g>
</svg>
