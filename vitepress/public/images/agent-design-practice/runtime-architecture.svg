<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Agent Harness 受控反馈循环</title>
  <desc id="desc">客户端输入经过会话运行时和上下文编译器交给模型，模型提出工具调用，工具运行时在权限与沙箱边界内执行，结果写回事件账本。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185FA5"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#888780"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:30px;font-weight:700;fill:#2C2C2A}.sub{font-size:17px;fill:#6B6A66}.label{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#185FA5}.head{font-size:21px;font-weight:700;fill:#2C2C2A}.body{font-size:17px;fill:#55544F}.small{font-size:15px;fill:#6B6A66}.white{fill:#fff}.line{fill:none;stroke:#185FA5;stroke-width:2;marker-end:url(#arrowBlue)}.event{fill:none;stroke:#888780;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrowGray)}</style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="36" y="45" class="title">Agent Harness：一次判断怎样变成可恢复的行动</text>
  <text x="36" y="73" class="sub">上半段形成判断，下半段产生副作用；执行结果回到账本以后，下一次采样重新开始。</text>
  <rect x="36" y="128" width="190" height="108" rx="13" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="58" y="160" class="label" fill="#5F5E5A">CLIENT</text><text x="58" y="193" class="head">TUI · IDE · SDK</text><text x="58" y="220" class="small">input · steering · interrupt</text>
  <rect x="286" y="116" width="238" height="132" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="310" y="150" class="label">SESSION RUNTIME</text><text x="310" y="184" class="head">Thread · Turn · Item</text><text x="310" y="214" class="body">登记输入，维护生命周期</text><text x="310" y="238" class="small">恢复 · 中断 · 流式事件</text>
  <rect x="584" y="116" width="238" height="132" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="608" y="150" class="label">REQUEST COMPILER</text><text x="608" y="184" class="head">Context Builder</text><text x="608" y="214" class="body">选择 · 排序 · 外置 · 压缩</text><text x="608" y="238" class="small">输出一次 Model View</text>
  <rect x="882" y="116" width="282" height="132" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.3"/>
  <text x="906" y="150" class="label" fill="#534AB7">DECISION</text><text x="906" y="184" class="head">Model Adapter</text><text x="906" y="214" class="body">message 或下一组 tool call</text>
  <rect x="36" y="354" width="292" height="158" rx="14" fill="#F7F7F5" stroke="#B4B2A9" stroke-width="1.2"/>
  <text x="60" y="388" class="label">SOURCE OF TRUTH</text><text x="60" y="423" class="head">Thread Event Store</text><text x="60" y="453" class="body">u-1 → call-7 → result-7</text><text x="60" y="482" class="small">append-only · 可恢复 · 可审计</text>
  <rect x="366" y="354" width="158" height="158" rx="14" fill="#F7F7F5" stroke="#B4B2A9" stroke-width="1.2"/>
  <text x="390" y="388" class="label">SUPPORT</text><text x="390" y="423" class="head">Artifact</text><text x="390" y="450" class="head">Derived State</text><text x="390" y="480" class="small">日志 · plan · revision</text>
  <rect x="584" y="330" width="238" height="182" rx="14" fill="#FFF8ED" stroke="#BA7517" stroke-width="1.3"/>
  <text x="608" y="364" class="label" fill="#854F0B">SIDE-EFFECT BOUNDARY</text><text x="608" y="398" class="head">Tool Runtime</text>
  <rect x="608" y="422" width="190" height="34" rx="8" fill="#FAEEDA"/><text x="703" y="444" text-anchor="middle" class="body">Policy · Approval</text>
  <rect x="608" y="466" width="190" height="30" rx="8" fill="#FAEEDA"/><text x="703" y="486" text-anchor="middle" class="small">Sandbox · Conflict Control</text>
  <rect x="882" y="330" width="282" height="182" rx="14" fill="#E8F5E9" stroke="#3B7A3F" stroke-width="1.3"/>
  <text x="906" y="364" class="label" fill="#2E7D32">EXECUTION</text><text x="906" y="398" class="head">Tools · Workspace</text><text x="906" y="430" class="body">shell · files · MCP · apps</text><line x1="906" y1="451" x2="1138" y2="451" stroke="#A7C8A9"/><text x="906" y="480" class="small">产生副作用，返回结构化 result</text>
  <path d="M226 182H286" class="line"/><text x="239" y="168" class="small">输入</text>
  <path d="M524 182H584" class="line"/><text x="536" y="168" class="small">编译</text>
  <path d="M822 182H882" class="line"/><text x="836" y="168" class="small">采样</text>
  <path d="M1023 248V286C1023 308 800 308 800 330" class="line"/><text x="906" y="292" class="small">tool call</text>
  <path d="M822 421H882" class="line"/><text x="836" y="407" class="small">执行</text>
  <path d="M1023 512V592H182V512" class="line"/><text x="536" y="582" class="small">tool result → append event</text>
  <path d="M405 248V320C405 338 304 338 304 354" class="line"/><text x="417" y="302" class="small">事件落账</text>
  <path d="M328 404C430 404 500 222 584 204" class="event"/><text x="408" y="350" class="small">读取事实</text>
  <path d="M524 438C550 438 556 252 608 248" class="event"/>
  <path d="M36 432H18V182H36" class="event"/><text x="46" y="314" class="small">runtime events</text>
</svg>
