<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">一个 Turn 的完整时序</title>
  <desc id="desc">用户输入写入事件账本，Context Builder 编译视图，模型返回工具调用，工具执行结果回写；用户补充在下一个安全采样点进入模型视图。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185FA5"/></marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#888780"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:30px;font-weight:700;fill:#2C2C2A}.sub{font-size:17px;fill:#6B6A66}.lane{font-size:18px;font-weight:700;fill:#2C2C2A}.body{font-size:16px;fill:#444441}.small{font-size:14px;fill:#6B6A66}.note{font-size:15px;fill:#185FA5}.line{fill:none;stroke:#185FA5;stroke-width:1.8;marker-end:url(#arr)}.gray{fill:none;stroke:#888780;stroke-width:1.4;stroke-dasharray:5 5;marker-end:url(#arrGray)}</style>
  </defs>
  <rect width="1200" height="790" fill="#fff"/>
  <text x="36" y="43" class="title">一个 Turn：事件先落账，模型在采样点看见变化</text>
  <text x="36" y="67" class="sub">示例任务：修复登录接口偶发 500；测试运行期间，用户补充“保持公开接口稳定”。</text>

  <rect x="36" y="94" width="180" height="48" rx="8" fill="#F1EFE8"/><text x="126" y="124" text-anchor="middle" class="lane">Client</text>
  <rect x="254" y="94" width="214" height="48" rx="8" fill="#E6F1FB"/><text x="361" y="124" text-anchor="middle" class="lane">Runtime / Event Store</text>
  <rect x="506" y="94" width="190" height="48" rx="8" fill="#E6F1FB"/><text x="601" y="124" text-anchor="middle" class="lane">Context Builder</text>
  <rect x="734" y="94" width="160" height="48" rx="8" fill="#EEEDFE"/><text x="814" y="124" text-anchor="middle" class="lane">Model</text>
  <rect x="932" y="94" width="232" height="48" rx="8" fill="#FAEEDA"/><text x="1048" y="124" text-anchor="middle" class="lane">Policy · Sandbox · Tool</text>

  <g stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 5"><line x1="126" y1="142" x2="126" y2="742"/><line x1="361" y1="142" x2="361" y2="742"/><line x1="601" y1="142" x2="601" y2="742"/><line x1="814" y1="142" x2="814" y2="742"/><line x1="1048" y1="142" x2="1048" y2="742"/></g>

  <path d="M126 184H361" class="line"/><text x="146" y="175" class="body">输入 1：修复登录 500</text>
  <rect x="278" y="196" width="166" height="37" rx="7" fill="#E6F1FB"/><text x="361" y="220" text-anchor="middle" class="body">start Turn 1 · append u-1</text>

  <path d="M361 260H601" class="line"/><text x="405" y="251" class="body">build Context View v1</text>
  <path d="M601 292H814" class="line"/><text x="644" y="283" class="body">instructions + tools + u-1</text>
  <rect x="754" y="304" width="120" height="35" rx="7" fill="#EEEDFE"/><text x="814" y="327" text-anchor="middle" class="body">sample 1</text>
  <path d="M814 360H361" class="line"/><text x="544" y="351" class="body">append message + call-7</text>
  <path d="M361 382H1048" class="line"/><text x="624" y="373" class="body">dispatch search_code(call-7)</text>
  <rect x="960" y="394" width="176" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517"/><text x="1048" y="416" text-anchor="middle" class="small">allow → sandbox → execute</text><text x="1048" y="435" text-anchor="middle" class="small">tool still running</text>

  <path d="M126 430H361" class="line"/><text x="148" y="421" class="body">输入 2：保持公开接口稳定</text>
  <rect x="278" y="442" width="166" height="37" rx="7" fill="#E6F1FB"/><text x="361" y="466" text-anchor="middle" class="body">append steering-2</text>

  <path d="M1048 512H361" class="line"/><text x="618" y="503" class="body">append function_call_output(call-7)</text>
  <rect x="278" y="524" width="166" height="37" rx="7" fill="#E8F5E9"/><text x="361" y="548" text-anchor="middle" class="body">call-7 ↔ result-7</text>

  <path d="M361 594H601" class="line"/><text x="405" y="585" class="body">build Context View v2</text>
  <path d="M601 626H814" class="line"/><text x="622" y="617" class="body">result-7 + steering-2 + plan</text>
  <rect x="754" y="638" width="120" height="35" rx="7" fill="#EEEDFE"/><text x="814" y="661" text-anchor="middle" class="body">sample 2</text>
  <path d="M814 700H361" class="line"/><text x="566" y="691" class="body">继续调用工具，或 final message</text>
  <path d="M361 738H126" class="gray"/><text x="183" y="730" class="small">turn/completed · stream final</text>

  <rect x="930" y="550" width="234" height="76" rx="10" fill="#FFF8ED" stroke="#BA7517"/>
  <text x="947" y="574" class="note">安全采样点</text>
  <text x="947" y="596" class="small">在途工具参数保持不变；新输入</text>
  <text x="947" y="614" class="small">和 tool result 一起进入下一次采样。</text>
</svg>
