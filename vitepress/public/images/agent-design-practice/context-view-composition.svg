<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">上下文来源与一次 Model View 的组成</title>
  <desc id="desc">项目规则、Thread 历史、Memory、Skills、工具目录、Artifact 和当前 Workspace 经过 Context Builder 选择后，组成一次性的 Model Request。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185FA5"/></marker>
    <marker id="grayArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#888780"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:30px;font-weight:700;fill:#2C2C2A}.sub{font-size:17px;fill:#6B6A66}.label{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#185FA5}.head{font-size:21px;font-weight:700;fill:#2C2C2A}.body{font-size:17px;fill:#55544F}.small{font-size:15px;fill:#6B6A66}.white{fill:#fff}.line{fill:none;stroke:#185FA5;stroke-width:2;marker-end:url(#arr)}.read{fill:none;stroke:#888780;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#grayArr)}</style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="36" y="45" class="title">Context Builder：不同寿命的数据，编译成一次请求</text>
  <text x="36" y="73" class="sub">规则、记忆、任务历史和当前现场分开保存；进入 Model View 时再按用途选择。</text>
  <text x="38" y="116" class="label">CONTEXT SOURCES</text>
  <rect x="36" y="134" width="312" height="130" rx="14" fill="#F7F7F5" stroke="#B4B2A9"/>
  <text x="60" y="169" class="head">长期上下文</text><text x="60" y="201" class="body">项目规则　人写，按作用域加载</text><text x="60" y="232" class="body">Memory　模型提炼，使用前核对</text>
  <rect x="36" y="286" width="312" height="130" rx="14" fill="#E6F1FB" stroke="#9FC0D9"/>
  <text x="60" y="321" class="head">当前 Thread</text><text x="60" y="353" class="body">Event Store　完整有序的事实</text><text x="60" y="384" class="body">recent turn · steering · tool result</text>
  <rect x="36" y="438" width="312" height="166" rx="14" fill="#F7F7F5" stroke="#B4B2A9"/>
  <text x="60" y="473" class="head">按需内容与当前现场</text><text x="60" y="505" class="body">Skills · tool catalog · Artifact</text><text x="60" y="536" class="body">Workspace · cwd · git · process</text><text x="60" y="573" class="small">大结果留句柄，现场在采样前重读</text>
  <rect x="430" y="166" width="270" height="398" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="456" y="204" class="label">CONTEXT BUILDER</text><text x="456" y="241" class="head">一次请求的编译器</text><text x="456" y="286" class="body">1　按相关性选择</text><text x="456" y="324" class="body">2　按确定顺序组装</text><text x="456" y="362" class="body">3　校验 call / result 配对</text><text x="456" y="400" class="body">4　外置大结果，保留句柄</text><text x="456" y="438" class="body">5　估算 token，触发压缩</text><line x1="456" y1="469" x2="674" y2="469" stroke="#9FC0D9"/><text x="456" y="500" class="small">输出不是新的事实源</text><rect x="448" y="522" width="234" height="26" rx="13" fill="#185FA5"/><text x="565" y="540" text-anchor="middle" class="small white">input = context - output - buffer</text>
  <text x="780" y="116" class="label">MODEL REQUEST N</text>
  <rect x="778" y="134" width="386" height="470" rx="16" fill="#fff" stroke="#534AB7" stroke-width="1.5"/>
  <rect x="800" y="158" width="342" height="92" rx="10" fill="#534AB7"/><text x="824" y="189" class="label white">STABLE PREFIX</text><text x="824" y="221" class="head white">Runtime + Project Rules</text>
  <rect x="800" y="268" width="342" height="86" rx="10" fill="#EEEDFE"/><text x="824" y="299" class="head">Capabilities</text><text x="824" y="328" class="body">tool schemas · loaded Skills</text>
  <rect x="800" y="372" width="342" height="86" rx="10" fill="#E6F1FB"/><text x="824" y="403" class="head">History + Recall</text><text x="824" y="432" class="body">compaction · recent turns · Memory</text>
  <rect x="800" y="476" width="342" height="104" rx="10" fill="#FAEEDA"/><text x="824" y="507" class="head">Dynamic Tail</text><text x="824" y="536" class="body">live state · user · steering · result</text><text x="824" y="562" class="small">每次采样变化，尽量只在尾部追加</text>
  <path d="M348 199C392 199 390 252 430 252" class="read"/><path d="M348 351H430" class="read"/><path d="M348 521C392 521 390 438 430 438" class="read"/><path d="M700 365H778" class="line"/>
  <path d="M971 604V660H192V604" class="line"/><text x="438" y="650" class="small">model output 写回 Event Store，下一次采样重新编译</text>
</svg>
