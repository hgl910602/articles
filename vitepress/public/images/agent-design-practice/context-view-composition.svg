<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08264d"/><stop offset="1" stop-color="#0a5bff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#062452" flood-opacity=".10"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#0a5bff"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:39px;font-weight:760}.subtitle{font-size:18px;fill:#4a6480}.eyebrow{font-size:14px;font-weight:760;letter-spacing:1.7px}.section{font-size:18px;font-weight:760}.cardTitle{font-size:18px;font-weight:760}.body{font-size:15px;fill:#4b6580}.tiny{font-size:13px;fill:#607894}.white{fill:#fff}.whiteSoft{fill:#dceaff}.blue{fill:#0a5bff}.flow{fill:none;stroke:#0a5bff;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#79a8f3;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#f5f8fc"/>
  <text x="72" y="66" class="title">上下文生命周期：存储、编译与压缩</text>
  <text x="72" y="98" class="subtitle">Thread 保存完整事实，Context Builder 为每次采样编译临时视图；窗口预算触发分级压缩。</text>

  <g filter="url(#shadow)"><rect x="72" y="130" width="1456" height="88" rx="14" fill="#fff" stroke="#d8e2ef"/><rect x="72" y="130" width="176" height="88" rx="14" fill="url(#hero)"/><path d="M234 130H248V218H234" fill="url(#hero)"/></g>
  <text x="102" y="165" class="eyebrow whiteSoft">PROBLEM</text><text x="102" y="191" class="section white">上下文问题</text>
  <text x="286" y="165" class="cardTitle">完整历史持续增长，模型窗口却有固定预算</text>
  <text x="286" y="192" class="body">系统需要保留审计事实，同时给模型提供稳定前缀、最近证据和当前任务。</text>

  <rect x="72" y="248" width="1456" height="626" rx="18" fill="#fff" stroke="#d8e2ef" filter="url(#shadow)"/>

  <text x="98" y="286" class="eyebrow blue">LAYER 1 · SOURCE OF TRUTH</text><text x="98" y="313" class="section">Thread Event Store：完整事实账本</text>
  <g>
    <rect x="104" y="334" width="168" height="70" rx="10" fill="#edf4ff" stroke="#8cb6f4"/><text x="188" y="363" text-anchor="middle" class="cardTitle">u-1</text><text x="188" y="386" text-anchor="middle" class="tiny">user message</text>
    <rect x="302" y="334" width="168" height="70" rx="10" fill="#edf4ff" stroke="#8cb6f4"/><text x="386" y="363" text-anchor="middle" class="cardTitle">a-1</text><text x="386" y="386" text-anchor="middle" class="tiny">assistant item</text>
    <rect x="500" y="334" width="168" height="70" rx="10" fill="#e1ecff" stroke="#5e98f4"/><text x="584" y="363" text-anchor="middle" class="cardTitle">call-7</text><text x="584" y="386" text-anchor="middle" class="tiny">search_code</text>
    <rect x="698" y="334" width="168" height="70" rx="10" fill="#e1ecff" stroke="#5e98f4"/><text x="782" y="363" text-anchor="middle" class="cardTitle">result-7</text><text x="782" y="386" text-anchor="middle" class="tiny">preview + artifact_ref</text>
    <rect x="896" y="334" width="168" height="70" rx="10" fill="#edf4ff" stroke="#8cb6f4"/><text x="980" y="363" text-anchor="middle" class="cardTitle">steer-2</text><text x="980" y="386" text-anchor="middle" class="tiny">保持接口稳定</text>
    <rect x="1094" y="334" width="168" height="70" rx="10" fill="#e1ecff" stroke="#5e98f4"/><text x="1178" y="363" text-anchor="middle" class="cardTitle">call-8</text><text x="1178" y="386" text-anchor="middle" class="tiny">read_file</text>
    <rect x="1292" y="334" width="168" height="70" rx="10" fill="#0b2b55"/><text x="1376" y="363" text-anchor="middle" class="cardTitle white">result-8</text><text x="1376" y="386" text-anchor="middle" class="tiny whiteSoft">full output in artifact</text>
    <path d="M272 369H302M470 369H500M668 369H698M866 369H896M1064 369H1094M1262 369H1292" stroke="#0a5bff" stroke-width="2"/>
  </g>

  <line x1="98" y1="436" x2="1502" y2="436" stroke="#d8e2ef"/>
  <text x="98" y="472" class="eyebrow blue">LAYER 2 · REQUEST COMPILER</text><text x="98" y="499" class="section">Context Builder：把四类输入编译成一次 Model Request</text>

  <g>
    <rect x="104" y="526" width="260" height="118" rx="13" fill="#0a5bff"/><text x="130" y="558" class="eyebrow whiteSoft">STABLE PREFIX</text><text x="130" y="586" class="cardTitle white">稳定前缀</text><text x="130" y="612" class="body whiteSoft">tool schemas · runtime rules</text><text x="130" y="632" class="tiny whiteSoft">project instructions · versions</text>
    <rect x="390" y="526" width="260" height="118" rx="13" fill="#edf4ff" stroke="#78a9f5"/><text x="416" y="558" class="eyebrow blue">HISTORY</text><text x="416" y="586" class="cardTitle">历史视图</text><text x="416" y="612" class="body">compaction item</text><text x="416" y="632" class="tiny">最近几个原始 turn</text>
    <rect x="676" y="526" width="260" height="118" rx="13" fill="#edf4ff" stroke="#78a9f5"/><text x="702" y="558" class="eyebrow blue">CURRENT STATE</text><text x="702" y="586" class="cardTitle">当前现场</text><text x="702" y="612" class="body">cwd · git · plan · process</text><text x="702" y="632" class="tiny">workspace revision</text>
    <rect x="962" y="526" width="260" height="118" rx="13" fill="#edf4ff" stroke="#78a9f5"/><text x="988" y="558" class="eyebrow blue">DYNAMIC TAIL</text><text x="988" y="586" class="cardTitle">当前增量</text><text x="988" y="612" class="body">user · steering · tool_result</text><text x="988" y="632" class="tiny">每次采样变化</text>
    <rect x="1270" y="526" width="190" height="118" rx="13" fill="#08264d"/><text x="1365" y="572" text-anchor="middle" class="cardTitle white">Model Request N</text><text x="1365" y="601" text-anchor="middle" class="body whiteSoft">ordered input</text><text x="1365" y="625" text-anchor="middle" class="tiny whiteSoft">within token budget</text>
    <path d="M364 585H390M650 585H676M936 585H962M1222 585H1270" class="flow"/>
  </g>

  <line x1="98" y1="680" x2="1502" y2="680" stroke="#d8e2ef"/>
  <text x="98" y="716" class="eyebrow blue">LAYER 3 · BUDGET CONTROL</text><text x="98" y="743" class="section">超过输入预算：按成本从低到高处理</text>
  <g>
    <rect x="104" y="766" width="300" height="80" rx="12" fill="#f7faff" stroke="#9fc0f5"/><text x="130" y="798" class="cardTitle">1　折叠传输噪声</text><text x="130" y="824" class="body">delta → completed item</text>
    <rect x="446" y="766" width="300" height="80" rx="12" fill="#edf4ff" stroke="#78a9f5"/><text x="472" y="798" class="cardTitle">2　外置大结果</text><text x="472" y="824" class="body">日志 → preview + artifact_ref</text>
    <rect x="788" y="766" width="300" height="80" rx="12" fill="#e3eeff" stroke="#5d97f0"/><text x="814" y="798" class="cardTitle">3　压缩已完成区间</text><text x="814" y="824" class="body">items 1…82 → cmp-3</text>
    <rect x="1130" y="766" width="330" height="80" rx="12" fill="#0a5bff"/><text x="1156" y="798" class="cardTitle white">4　恢复检查</text><text x="1156" y="824" class="body whiteSoft">约束 · 决策 · 证据 · open loops</text>
    <path d="M404 806H446M746 806H788M1088 806H1130" class="flow"/>
  </g>

  <rect x="72" y="908" width="1456" height="106" rx="14" fill="url(#hero)"/>
  <text x="102" y="947" class="eyebrow whiteSoft">CONTEXT SOLUTION</text><text x="102" y="977" class="section white">Event Store 完整保留事实，Model View 按当前任务和预算重新编译</text>
  <text x="102" y="1000" class="tiny whiteSoft">缓存负责减少重复计算；compaction 负责控制窗口；artifact 负责保留完整证据。</text>
  <text x="1160" y="974" class="cardTitle white">完整存储 · 按需入模</text>
</svg>
