<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08264d"/><stop offset="1" stop-color="#0a5bff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#062452" flood-opacity=".10"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#0a5bff"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:39px;font-weight:760}.subtitle{font-size:18px;fill:#4a6480}.eyebrow{font-size:14px;font-weight:760;letter-spacing:1.7px}.section{font-size:18px;font-weight:760}.cardTitle{font-size:18px;font-weight:760}.body{font-size:15px;fill:#4b6580}.tiny{font-size:13px;fill:#607894}.white{fill:#fff}.whiteSoft{fill:#dceaff}.blue{fill:#0a5bff}.flow{fill:none;stroke:#0a5bff;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#6a9ff4;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f5f8fc"/>
  <text x="72" y="66" class="title">多次输入如何进入同一个 Thread</text>
  <text x="72" y="98" class="subtitle">运行时先判断 Thread / Turn 状态，再把输入路由为新 Turn、steering、interrupt 或 fork。</text>

  <g filter="url(#shadow)"><rect x="72" y="130" width="1456" height="88" rx="14" fill="#fff" stroke="#d8e2ef"/><rect x="72" y="130" width="176" height="88" rx="14" fill="url(#hero)"/><path d="M234 130H248V218H234" fill="url(#hero)"/></g>
  <text x="102" y="165" class="eyebrow whiteSoft">PROBLEM</text><text x="102" y="191" class="section white">请求路由问题</text>
  <text x="286" y="165" class="cardTitle">同一句用户输入，在空闲、运行中和完成后三种状态下，对应三种处理方式</text>
  <text x="286" y="192" class="body">输入先成为 Runtime Event，再在安全采样点进入模型视图。</text>

  <rect x="72" y="248" width="1456" height="564" rx="18" fill="#fff" stroke="#d8e2ef" filter="url(#shadow)"/>
  <text x="98" y="286" class="eyebrow blue">THREAD T-42 · EVENT TIMELINE</text>
  <line x1="138" y1="394" x2="1460" y2="394" stroke="#bdd0e8" stroke-width="4"/>

  <g>
    <circle cx="250" cy="394" r="13" fill="#0a5bff"/><circle cx="795" cy="394" r="13" fill="#0a5bff"/><circle cx="1338" cy="394" r="13" fill="#0a5bff"/>
    <rect x="112" y="318" width="276" height="58" rx="12" fill="#0a5bff"/><text x="250" y="354" text-anchor="middle" class="cardTitle white">输入 1：修复登录 500</text>
    <rect x="657" y="318" width="276" height="58" rx="12" fill="#08264d"/><text x="795" y="354" text-anchor="middle" class="cardTitle white">输入 2：保持接口稳定</text>
    <rect x="1200" y="318" width="276" height="58" rx="12" fill="#0a5bff"/><text x="1338" y="354" text-anchor="middle" class="cardTitle white">输入 3：检查注册接口</text>
  </g>

  <g>
    <rect x="112" y="438" width="360" height="250" rx="15" fill="#f7faff" stroke="#9fc0f5"/>
    <text x="138" y="473" class="eyebrow blue">THREAD IDLE</text><text x="138" y="505" class="section">创建 Turn 1</text>
    <rect x="138" y="530" width="308" height="55" rx="9" fill="#e8f1ff"/><text x="158" y="563" class="body">append user item u-1</text>
    <rect x="138" y="598" width="308" height="64" rx="9" fill="#fff" stroke="#c7d8ed"/><text x="158" y="625" class="body">Context View v1</text><text x="158" y="648" class="tiny">项目指令 + 工具 + 输入 1</text>

    <rect x="620" y="438" width="360" height="250" rx="15" fill="#edf4ff" stroke="#6fa5ff"/>
    <text x="646" y="473" class="eyebrow blue">TURN 1 ACTIVE</text><text x="646" y="505" class="section">追加 steering item</text>
    <rect x="646" y="530" width="308" height="55" rx="9" fill="#dceaff"/><text x="666" y="563" class="body">在途工具保持原样</text>
    <rect x="646" y="598" width="308" height="64" rx="9" fill="#fff" stroke="#9fc0f5"/><text x="666" y="625" class="body">Context View v1.1</text><text x="666" y="648" class="tiny">tool_result + steering + 当前计划</text>

    <rect x="1128" y="438" width="360" height="250" rx="15" fill="#f7faff" stroke="#9fc0f5"/>
    <text x="1154" y="473" class="eyebrow blue">TURN 1 COMPLETED</text><text x="1154" y="505" class="section">创建 Turn 2</text>
    <rect x="1154" y="530" width="308" height="55" rx="9" fill="#e8f1ff"/><text x="1174" y="563" class="body">append user item u-3</text>
    <rect x="1154" y="598" width="308" height="64" rx="9" fill="#fff" stroke="#c7d8ed"/><text x="1174" y="625" class="body">Context View v2</text><text x="1174" y="648" class="tiny">Turn 1 摘要 + 输入 3 + 当前现场</text>
  </g>

  <path d="M250 407V438" class="flow"/><path d="M795 407V438" class="flow"/><path d="M1338 407V438" class="flow"/>

  <g>
    <rect x="112" y="718" width="1376" height="66" rx="12" fill="#0b2b55"/>
    <text x="138" y="758" class="section white">Thread Event Store</text>
    <text x="350" y="758" class="body whiteSoft">u-1 → model / call / result → steering-2 → final-1 → u-3 → model / call / result → final-2</text>
    <text x="1270" y="758" class="tiny whiteSoft">append-only</text>
  </g>

  <rect x="72" y="844" width="1456" height="88" rx="14" fill="url(#hero)"/>
  <text x="102" y="879" class="eyebrow whiteSoft">ROUTING SOLUTION</text><text x="102" y="907" class="section white">Thread 保存长期现场，Turn 划定工作边界，Item 记录每次状态变化</text>
  <text x="1128" y="895" class="cardTitle white">先登记事件，再进入采样</text>
</svg>
