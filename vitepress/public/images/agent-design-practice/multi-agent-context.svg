<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 的上下文与工作区隔离</title>
  <desc id="desc">主 Agent 保存用户目标并派发任务包，子 Agent 各自拥有独立上下文和工具循环；只读任务共享 checkout，冲突写任务使用独立 worktree。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#185FA5"/></marker>
    <marker id="grayArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#888780"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:30px;font-weight:700;fill:#2C2C2A}.sub{font-size:17px;fill:#6B6A66}.label{font-size:14px;font-weight:700;letter-spacing:1.5px;fill:#185FA5}.head{font-size:21px;font-weight:700;fill:#2C2C2A}.body{font-size:16px;fill:#5F5E5A}.small{font-size:14px;fill:#6B6A66}.white{fill:#fff}.line{fill:none;stroke:#185FA5;stroke-width:1.9;marker-end:url(#arr)}.return{fill:none;stroke:#888780;stroke-width:1.4;stroke-dasharray:5 5;marker-end:url(#grayArr)}</style>
  </defs>
  <rect width="1200" height="780" fill="#fff"/>
  <text x="36" y="43" class="title">多 Agent：先隔离上下文，再按写冲突决定工作区</text>
  <text x="36" y="67" class="sub">子 Agent 不是角色标签，它有自己的 Context View、工具循环和结果协议。</text>

  <rect x="36" y="126" width="286" height="358" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="60" y="159" class="label">MAIN THREAD</text>
  <text x="60" y="193" class="head">Orchestrator Agent</text>
  <text x="60" y="224" class="body">保留：用户目标 · 硬约束 · 当前计划</text>
  <text x="60" y="252" class="body">负责：拆分 · 派发 · 等待 · steering</text>
  <text x="60" y="280" class="body">验收：证据 · diff · 测试 · 冲突处理</text>
  <line x1="60" y1="306" x2="298" y2="306" stroke="#9FC0D9"/>
  <text x="60" y="337" class="head">Task Packet</text>
  <rect x="60" y="355" width="238" height="96" rx="10" fill="#fff" stroke="#9FC0D9"/>
  <text x="76" y="379" class="small">目标 · 范围 · 已知事实</text>
  <text x="76" y="402" class="small">文件所有权 · 工具 / 权限</text>
  <text x="76" y="425" class="small">返回格式 · 完成条件</text>

  <text x="398" y="112" class="label">ISOLATED AGENT RUNTIMES</text>
  <rect x="396" y="126" width="768" height="134" rx="14" fill="#F7F7F5" stroke="#B4B2A9"/>
  <rect x="396" y="126" width="176" height="134" rx="14" fill="#185FA5"/>
  <rect x="558" y="126" width="14" height="134" fill="#185FA5"/>
  <text x="418" y="159" class="label white">AGENT A</text><text x="418" y="190" class="head white">代码探索</text><text x="418" y="216" class="small white">Read · Search</text>
  <text x="604" y="161" class="head">Context View A</text>
  <text x="604" y="190" class="body">任务事实按需装载，不继承主线程全部历史</text>
  <text x="604" y="218" class="small">返回：结论 + 证据位置 + 未决问题</text>

  <rect x="396" y="282" width="768" height="134" rx="14" fill="#F7F7F5" stroke="#B4B2A9"/>
  <rect x="396" y="282" width="176" height="134" rx="14" fill="#534AB7"/>
  <rect x="558" y="282" width="14" height="134" fill="#534AB7"/>
  <text x="418" y="315" class="label white">AGENT B</text><text x="418" y="346" class="head white">测试与验证</text><text x="418" y="372" class="small white">Shell · read-only FS</text>
  <text x="604" y="317" class="head">Context View B</text>
  <text x="604" y="346" class="body">命令预算、权限和终止条件单独配置</text>
  <text x="604" y="374" class="small">返回：测试结果 + 复现命令 + artifact_ref</text>

  <rect x="396" y="438" width="768" height="134" rx="14" fill="#F7F7F5" stroke="#B4B2A9"/>
  <rect x="396" y="438" width="176" height="134" rx="14" fill="#2E7D32"/>
  <rect x="558" y="438" width="14" height="134" fill="#2E7D32"/>
  <text x="418" y="471" class="label white">AGENT C</text><text x="418" y="502" class="head white">实现任务</text><text x="418" y="528" class="small white">Edit · scoped write</text>
  <text x="604" y="473" class="head">Context View C</text>
  <text x="604" y="502" class="body">文件所有权、约束和验证方式单独给出</text>
  <text x="604" y="530" class="small">返回：修改摘要 + diff + 测试结果</text>

  <path d="M322 230H370V193H396" class="line"/><path d="M322 270H370V349H396" class="line"/><path d="M322 310H350V505H396" class="line"/>
  <path d="M396 552H350V454H322" class="return"/>

  <text x="38" y="630" class="label">WORKSPACE CHOICE</text>
  <rect x="36" y="648" width="1128" height="96" rx="13" fill="#fff" stroke="#B4B2A9"/>
  <rect x="58" y="669" width="322" height="54" rx="9" fill="#E8F5E9"/>
  <text x="76" y="692" class="head">共享 checkout</text><text x="76" y="714" class="small">只读任务，或写集合明确且完全分离</text>
  <path d="M400 696H438" class="line"/>
  <rect x="458" y="669" width="322" height="54" rx="9" fill="#FAEEDA"/>
  <text x="476" y="692" class="head">独立 worktree</text><text x="476" y="714" class="small">并行写入可能重叠，先隔离 diff</text>
  <path d="M800 696H838" class="line"/>
  <rect x="858" y="669" width="284" height="54" rx="9" fill="#E6F1FB"/>
  <text x="876" y="692" class="head">主线程验收</text><text x="876" y="714" class="small">review → test → merge / reject</text>
</svg>
