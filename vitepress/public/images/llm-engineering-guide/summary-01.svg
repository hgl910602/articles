<svg viewBox="0 0 680 560" width="100%" role="img" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>推理工程总结图</title>
  <desc>Prefill 与 Decode、KV Cache、批处理、显存账本四要素</desc>

  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">推理工程</text>
  <text x="340" y="50" text-anchor="middle" font-size="13" font-weight="400" fill="#888780">模型服务的四块基石</text>

  <line x1="70" y1="78" x2="70" y2="413" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/>

  <circle cx="70" cy="100" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="70" y="100" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#712B13">1</text>
  <text x="100" y="95" font-size="14" font-weight="500" fill="#712B13">读题与写字</text>
  <text x="100" y="113" font-size="13" font-weight="400" fill="#5F5E5A">Prefill 一次并行算完输入 · Decode 一个 token 一个 token 串行生成</text>

  <circle cx="70" cy="165" r="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="70" y="165" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">2</text>
  <text x="100" y="160" font-size="14" font-weight="500" fill="#633806">KV Cache 草稿纸</text>
  <text x="100" y="178" font-size="13" font-weight="400" fill="#5F5E5A">缓存注意力的 K/V 避免重算 · 但按"并发 × 上下文"吃显存，常常比权重还大</text>

  <circle cx="70" cy="230" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="70" y="230" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">3</text>
  <text x="100" y="225" font-size="14" font-weight="500" fill="#3C3489">批处理拼车</text>
  <text x="100" y="243" font-size="13" font-weight="400" fill="#5F5E5A">连续批处理让请求随到随走 · 吞吐提升数倍，代价是单请求延迟略增</text>

  <circle cx="70" cy="295" r="13" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="70" y="295" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">4</text>
  <text x="100" y="290" font-size="14" font-weight="500" fill="#0C447C">显存账本</text>
  <text x="100" y="308" font-size="13" font-weight="400" fill="#5F5E5A">权重 + KV Cache 池 + 框架开销 · 算完账再买卡</text>

  <line x1="40" y1="365" x2="640" y2="365" stroke="#D3D1C7" stroke-width="0.5"/>

  <text x="340" y="385" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">两条铁律</text>

  <rect x="40" y="400" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="55" y="420" font-size="12" font-weight="500" fill="#444441">延迟大头在输出</text>
  <text x="55" y="440" font-size="11" font-weight="400" fill="#5F5E5A">总耗时 ≈ TTFT + 输出 token 数 × 每字耗时</text>

  <rect x="350" y="400" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="365" y="420" font-size="12" font-weight="500" fill="#444441">吞吐靠拼车，显存靠精算</text>
  <text x="365" y="440" font-size="11" font-weight="400" fill="#5F5E5A">连续批处理拉满 GPU · KV Cache 决定并发上限</text>
</svg>