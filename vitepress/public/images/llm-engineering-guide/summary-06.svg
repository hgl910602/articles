<svg viewBox="0 0 680 545" width="100%" role="img" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>Agent 工程总结图</title>
  <desc>决策循环、工具层、架构协作、记忆系统、四大子域全景</desc>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">Agent 工程：总纲</text>
  <text x="340" y="50" text-anchor="middle" font-size="13" font-weight="400" fill="#888780">决策循环 + 四大子域的汇合</text>
  <line x1="70" y1="78" x2="70" y2="373" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="70" cy="100" r="13" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="70" y="100" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#712B13">1</text>
  <text x="100" y="95" font-size="14" font-weight="500" fill="#712B13">决策循环</text>
  <text x="100" y="113" font-size="13" font-weight="400" fill="#5F5E5A">感知→思考→行动→观察 · 循环至任务完成</text>
  <circle cx="70" cy="165" r="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="70" y="165" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">2</text>
  <text x="100" y="160" font-size="14" font-weight="500" fill="#633806">工具层</text>
  <text x="100" y="178" font-size="13" font-weight="400" fill="#5F5E5A">Function Calling · MCP 生态 · 并行调用 · 反馈迭代</text>
  <circle cx="70" cy="230" r="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="70" y="230" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">3</text>
  <text x="100" y="225" font-size="14" font-weight="500" fill="#3C3489">架构与协作</text>
  <text x="100" y="243" font-size="13" font-weight="400" fill="#5F5E5A">ReAct · Plan-Execute · 多智能体 · HITL 人审</text>
  <circle cx="70" cy="295" r="13" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="70" y="295" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">4</text>
  <text x="100" y="290" font-size="14" font-weight="500" fill="#0C447C">记忆系统</text>
  <text x="100" y="308" font-size="13" font-weight="400" fill="#5F5E5A">ChatGPT 四层 · 文件即记忆 · 代码库即库 · 按需选型</text>
  <circle cx="70" cy="360" r="13" fill="#E8F5E9" stroke="#2E7D32" stroke-width="0.5"/>
  <text x="70" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1B5E20">5</text>
  <text x="100" y="355" font-size="14" font-weight="500" fill="#1B5E20">子域全景（6.9）</text>
  <text x="100" y="373" font-size="13" font-weight="400" fill="#5F5E5A">Prompt · 上下文 · RAG · Harness 各司其职 · L0~L5 自治度光谱</text>
  <line x1="40" y1="430" x2="640" y2="430" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="340" y="450" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">两句话</text>
  <rect x="40" y="465" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="55" y="485" font-size="12" font-weight="500" fill="#444441">模型是实习生不是管理员</text>
  <text x="55" y="505" font-size="11" font-weight="400" fill="#5F5E5A">工具走白名单，高危动作人审</text>
  <rect x="350" y="465" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="365" y="485" font-size="12" font-weight="500" fill="#444441">从简单开始</text>
  <text x="365" y="505" font-size="11" font-weight="400" fill="#5F5E5A">L0→L5 光谱选位，够用就好</text>
</svg>