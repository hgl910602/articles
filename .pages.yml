# Pages CMS 配置：https://pagescms.org
# 编辑体验说明：正文是整页 HTML，富文本编辑器不适用，
# body 字段用 code 模式（带语法高亮的源码编辑器）。

media:
  # 新上传的媒体统一放这里（已有图片仍在 articles/<slug>/images/，不受影响）
  input: media
  output: /media

content:
